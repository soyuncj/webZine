<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOVE EYE EXAM · 인사이드 부엉 - 박가희</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/detail.css" />
    <style>
      .episodes {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .episode {
        border: 2px solid var(--stroke);
        padding: 20px;
        text-align: center;
        font-family: "DXGothic", sans-serif;
        font-size: clamp(15px, 2vw, 18px);
        background: var(--card);
        text-decoration: none;
        color: var(--gray);
        display: block;
        border-radius: 8px;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .episode:hover,
      .episode:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
        color: var(--pink);
        border-color: var(--pink);
      }

      .episode:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="cartoon">
    <main class="page">
      <section class="clipboard">
        <div class="clip-card">Love <span class="eye">Eye</span> Exam</div>
        <div class="header">
          <div class="logo">인사이드 부엉</div>
          <a class="back" href="cartoon.html" aria-label="뒤로가기">&larr;</a>
        </div>
        <div class="episodes">
          <a class="episode" href="cartoon-5-1.html">1화</a>
          <a class="episode" href="cartoon-5-2.html">2화</a>
          <a class="episode" href="cartoon-5-3.html">3화</a>
          <a class="episode" href="cartoon-5-4.html">4화</a>
        </div>
      </section>
    </main>

    <div class="fab">
      <button type="button" id="themeToggle" aria-label="Toggle dark mode">
        DM
      </button>
      <button type="button" id="scrollTop" aria-label="Scroll to top">
        UP
      </button>
    </div>    </div>

    <script src="js/detail.js"></script>
  </body>
</html>
