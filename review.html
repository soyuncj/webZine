<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOVE EYE EXAM · Review</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/category.css" />
    <style>
      .hub {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        font-family: "RockLocal", "Rockwell", "Rockwell Nova", serif;
      }

      .hub-link {
        border: 2px solid var(--pink);
        padding: 28px 20px;
        background: #ffffff;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .hub-link:hover,
      .hub-link:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
      }

      .hub-link:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 2px;
      }

      .hub-label {
        font-size: clamp(16px, 2vw, 20px);
        font-weight: 600;
        color: var(--gray);
      }

      .hub-count {
        font-size: clamp(12px, 1.4vw, 14px);
        color: #999;
      }

      @media (max-width: 480px) {
        .hub {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="vision-bg" aria-hidden="true">
      <div class="vision-grid"></div>
      <div class="vision-glow"></div>
      <div class="vision-circle vision-circle-1"></div>
      <div class="vision-circle vision-circle-2"></div>
      <div class="vision-corner corner-tl"></div>
      <div class="vision-corner corner-tr"></div>
      <div class="vision-corner corner-bl"></div>
      <div class="vision-corner corner-br"></div>
    </div>

    <main class="page">
      <section class="frame">
        <div class="header">
          <div class="logo">LOVE EYE EXAM</div>
          <a class="back" href="index.html#main" aria-label="뒤로가기">&larr;</a>
        </div>
        <h1 class="title">Review</h1>
        <div class="hub">
          <a class="hub-link" href="review-novel.html">
            <span class="hub-label">Novel</span>
          </a>
          <a class="hub-link" href="review-cartoon.html">
            <span class="hub-label">Cartoon</span>
          </a>
        </div>
        <div class="select-bar" aria-label="Category selector">
          <div class="select-arc">
            <a class="select-ray" href="novel.html" style="--angle: -90deg;">
              <span class="ray-label">novel</span>
            </a>
            <div class="deco-ray" style="--angle: -80deg;"></div>
            <div class="deco-ray" style="--angle: -70deg;"></div>
            <div class="deco-ray" style="--angle: -60deg;"></div>
            <div class="deco-ray" style="--angle: -50deg;"></div>
            <a class="select-ray" href="cartoon.html" style="--angle: -40deg;">
              <span class="ray-label">cartoon</span>
            </a>
            <div class="deco-ray" style="--angle: -30deg;"></div>
            <div class="deco-ray" style="--angle: -20deg;"></div>
            <div class="deco-ray" style="--angle: -10deg;"></div>
            <div class="deco-ray" style="--angle: 0deg;"></div>
            <div class="deco-ray" style="--angle: 10deg;"></div>
            <div class="deco-ray" style="--angle: 20deg;"></div>
            <div class="deco-ray" style="--angle: 30deg;"></div>
            <div class="deco-ray" style="--angle: 40deg;"></div>
            <a class="select-ray active" href="review.html" style="--angle: 50deg;">
              <span class="ray-label">review</span>
            </a>
            <div class="deco-ray" style="--angle: 60deg;"></div>
            <div class="deco-ray" style="--angle: 70deg;"></div>
            <div class="deco-ray" style="--angle: 80deg;"></div>
            <div class="deco-ray" style="--angle: 90deg;"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="js/vision-bg.js"></script>
  </body>
</html>
