<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOVE EYE EXAM · Review</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/category.css" />
    <style>
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        font-family: "DXGothic", sans-serif;
      }

      .card {
        border: 2px solid #cfcfcf;
        padding: 14px;
        background: #ffffff;
        min-height: 120px;
        text-decoration: none;
        color: inherit;
        display: block;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover,
      .card:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
      }

      .card:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 2px;
      }

      .card-title {
        color: var(--gray);
        font-weight: 600;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="frame">
        <div class="header">
          <div class="logo">LOVE EYE EXAM</div>
          <div class="select-bar" aria-label="Category selector">
            <div class="select-arc">
              <a class="select-ray" href="novel.html" style="--angle: -90deg;">
                <span class="ray-label">novel</span>
              </a>
              <div class="deco-ray" style="--angle: -80deg;"></div>
              <div class="deco-ray" style="--angle: -70deg;"></div>
              <div class="deco-ray" style="--angle: -60deg;"></div>
              <div class="deco-ray" style="--angle: -50deg;"></div>
              <a class="select-ray" href="webtoon.html" style="--angle: -40deg;">
                <span class="ray-label">webtoon</span>
              </a>
              <div class="deco-ray" style="--angle: -30deg;"></div>
              <div class="deco-ray" style="--angle: -20deg;"></div>
              <div class="deco-ray" style="--angle: -10deg;"></div>
              <div class="deco-ray" style="--angle: 0deg;"></div>
              <div class="deco-ray" style="--angle: 10deg;"></div>
              <div class="deco-ray" style="--angle: 20deg;"></div>
              <div class="deco-ray" style="--angle: 30deg;"></div>
              <div class="deco-ray" style="--angle: 40deg;"></div>
              <a class="select-ray active" href="review.html" style="--angle: 50deg;">
                <span class="ray-label">review</span>
              </a>
              <div class="deco-ray" style="--angle: 60deg;"></div>
              <div class="deco-ray" style="--angle: 70deg;"></div>
              <div class="deco-ray" style="--angle: 80deg;"></div>
              <div class="deco-ray" style="--angle: 90deg;"></div>
            </div>
          </div>
          <a class="back" href="index.html#main" aria-label="뒤로가기">&larr;</a>
        </div>
        <h1 class="title">Review</h1>
        <div class="cards">
          <a class="card" href="review-1.html">
            <div class="card-title">리뷰 1</div>
            <div>요약 텍스트를 여기에 넣어주세요.</div>
          </a>
          <a class="card" href="review-2.html">
            <div class="card-title">리뷰 2</div>
            <div>요약 텍스트를 여기에 넣어주세요.</div>
          </a>
          <a class="card" href="review-3.html">
            <div class="card-title">리뷰 3</div>
            <div>요약 텍스트를 여기에 넣어주세요.</div>
          </a>
          <a class="card" href="review-4.html">
            <div class="card-title">리뷰 4</div>
            <div>요약 텍스트를 여기에 넣어주세요.</div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
