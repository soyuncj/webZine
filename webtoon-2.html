<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOVE EYE EXAM · 사랑을 재부팅합니다 - 이혜지, 장예지</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/detail.css" />
  </head>
  <body>
    <main class="page">
      <section class="clipboard">
        <div class="clip-card">Love <span class="eye">Eye</span> Exam</div>
        <div class="header">
          <div class="logo">사랑을 재부팅합니다</div>
          <a class="back" href="webtoon.html" aria-label="뒤로가기">&larr;</a>
        </div>
        <div class="content">
          <img src="src/webtoon/snd/2_1.png" alt="" loading="lazy" />
          <img src="src/webtoon/snd/2_2.png" alt="" loading="lazy" />
          <img src="src/webtoon/snd/2_3.png" alt="" loading="lazy" />
          <img src="src/webtoon/snd/2_4.png" alt="" loading="lazy" />
          <img src="src/webtoon/snd/2_5.png" alt="" loading="lazy" />
          <img src="src/webtoon/snd/2_6.png" alt="" loading="lazy" />
          <img src="src/webtoon/snd/2_7.png" alt="" loading="lazy" />
          <img src="src/webtoon/snd/2_8.png" alt="" loading="lazy" />
          <img src="src/webtoon/snd/2_9.png" alt="" loading="lazy" />
        </div>
      </section>
    </main>

    <div class="fab">
      <button type="button" id="themeToggle" aria-label="Toggle dark mode">
        DM
      </button>
      <button type="button" id="scrollTop" aria-label="Scroll to top">
        UP
      </button>
    </div>
    <div class="select-bar" aria-label="Category selector">
      <div class="select-arc">
        <a class="select-ray" href="novel.html" style="--angle: -90deg">
          <span class="ray-label">novel</span>
        </a>
        <div class="deco-ray" style="--angle: -80deg"></div>
        <div class="deco-ray" style="--angle: -70deg"></div>
        <div class="deco-ray" style="--angle: -60deg"></div>
        <div class="deco-ray" style="--angle: -50deg"></div>
        <a
          class="select-ray active"
          href="webtoon.html"
          style="--angle: -40deg"
        >
          <span class="ray-label">webtoon</span>
        </a>
        <div class="deco-ray" style="--angle: -30deg"></div>
        <div class="deco-ray" style="--angle: -20deg"></div>
        <div class="deco-ray" style="--angle: -10deg"></div>
        <div class="deco-ray" style="--angle: 0deg"></div>
        <div class="deco-ray" style="--angle: 10deg"></div>
        <div class="deco-ray" style="--angle: 20deg"></div>
        <div class="deco-ray" style="--angle: 30deg"></div>
        <div class="deco-ray" style="--angle: 40deg"></div>
        <a class="select-ray" href="review.html" style="--angle: 50deg">
          <span class="ray-label">review</span>
        </a>
        <div class="deco-ray" style="--angle: 60deg"></div>
        <div class="deco-ray" style="--angle: 70deg"></div>
        <div class="deco-ray" style="--angle: 80deg"></div>
        <div class="deco-ray" style="--angle: 90deg"></div>
      </div>
    </div>

    <script src="js/detail.js"></script>
  </body>
</html>
