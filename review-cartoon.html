<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOVE EYE EXAM · Cartoon Review</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/category.css" />
    <style>
      .list {
        display: grid;
        gap: 8px;
        font-family: "DXGothic", sans-serif;
      }

      .item {
        border: 2px solid #cfcfcf;
        padding: 10px 14px;
        background: #ffffff;
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 10px;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .item:hover,
      .item:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
      }

      .item:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="frame">
        <div class="header">
          <div class="logo">LOVE EYE EXAM</div>
          <a class="back" href="review.html" aria-label="뒤로가기">&larr;</a>
        </div>
        <h1 class="title">Cartoon Review</h1>
        <div class="list">
          <a class="item" href="review-cartoon-1.html">내 첫사랑은 단종</a>
          <a class="item" href="review-cartoon-2.html">사랑을 재부팅합니다</a>
          <a class="item" href="review-cartoon-3.html">둔주</a>
          <a class="item" href="review-cartoon-4.html">두부는 강쥐</a>
          <a class="item" href="review-cartoon-5.html">인사이드 부엉</a>
        </div>
      </section>
    </main>

    <div class="select-bar" aria-label="Category selector">
      <div class="select-arc">
        <a class="select-ray" href="novel.html" style="--angle: -90deg;">
          <span class="ray-label">novel</span>
        </a>
        <div class="deco-ray" style="--angle: -80deg;"></div>
        <div class="deco-ray" style="--angle: -70deg;"></div>
        <div class="deco-ray" style="--angle: -60deg;"></div>
        <div class="deco-ray" style="--angle: -50deg;"></div>
        <a class="select-ray" href="cartoon.html" style="--angle: -40deg;">
          <span class="ray-label">cartoon</span>
        </a>
        <div class="deco-ray" style="--angle: -30deg;"></div>
        <div class="deco-ray" style="--angle: -20deg;"></div>
        <div class="deco-ray" style="--angle: -10deg;"></div>
        <div class="deco-ray" style="--angle: 0deg;"></div>
        <div class="deco-ray" style="--angle: 10deg;"></div>
        <div class="deco-ray" style="--angle: 20deg;"></div>
        <div class="deco-ray" style="--angle: 30deg;"></div>
        <div class="deco-ray" style="--angle: 40deg;"></div>
        <a class="select-ray active" href="review.html" style="--angle: 50deg;">
          <span class="ray-label">review</span>
        </a>
        <div class="deco-ray" style="--angle: 60deg;"></div>
        <div class="deco-ray" style="--angle: 70deg;"></div>
        <div class="deco-ray" style="--angle: 80deg;"></div>
        <div class="deco-ray" style="--angle: 90deg;"></div>
      </div>
    </div>
  </body>
</html>
