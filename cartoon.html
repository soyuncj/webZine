<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOVE EYE EXAM · Cartoon</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/category.css" />
    <style>
      .thumbs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .thumb {
        border: 2px solid #cfcfcf;
        padding: 14px;
        background: #ffffff;
        text-decoration: none;
        color: inherit;
        display: block;
        overflow: hidden;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .thumb img {
        width: 100%;
        height: auto;
        display: block;
      }

      .thumb:hover,
      .thumb:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
      }

      .thumb:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="frame">
        <div class="header">
          <div class="logo">LOVE EYE EXAM</div>
          <a class="back" href="index.html#main" aria-label="뒤로가기">&larr;</a>
        </div>
        <h1 class="title">Cartoon</h1>
        <div class="thumbs">
          <a class="thumb" href="cartoon-1.html"
            ><img src="src/poster/poster1.jpg" alt="웹툰 1" loading="lazy"
          /></a>
          <a class="thumb" href="cartoon-2.html"
            ><img src="src/poster/poster4.png" alt="웹툰 2" loading="lazy"
          /></a>
          <a class="thumb" href="cartoon-3.html"
            ><img src="src/poster/poster3.png" alt="웹툰 3" loading="lazy"
          /></a>
          <a class="thumb" href="cartoon-4.html"
            ><img src="src/poster/poster2.jpeg" alt="웹툰 4" loading="lazy"
          /></a>
          <a class="thumb" href="cartoon-5.html"
            ><img src="src/poster/poster5.jpeg" alt="웹툰 5" loading="lazy"
          /></a>
        </div>
      </section>
    </main>

    <div class="select-bar" aria-label="Category selector">
      <div class="select-arc">
        <a class="select-ray" href="novel.html" style="--angle: -90deg;">
          <span class="ray-label">novel</span>
        </a>
        <div class="deco-ray" style="--angle: -80deg;"></div>
        <div class="deco-ray" style="--angle: -70deg;"></div>
        <div class="deco-ray" style="--angle: -60deg;"></div>
        <div class="deco-ray" style="--angle: -50deg;"></div>
        <a class="select-ray active" href="cartoon.html" style="--angle: -40deg;">
          <span class="ray-label">cartoon</span>
        </a>
        <div class="deco-ray" style="--angle: -30deg;"></div>
        <div class="deco-ray" style="--angle: -20deg;"></div>
        <div class="deco-ray" style="--angle: -10deg;"></div>
        <div class="deco-ray" style="--angle: 0deg;"></div>
        <div class="deco-ray" style="--angle: 10deg;"></div>
        <div class="deco-ray" style="--angle: 20deg;"></div>
        <div class="deco-ray" style="--angle: 30deg;"></div>
        <div class="deco-ray" style="--angle: 40deg;"></div>
        <a class="select-ray" href="review.html" style="--angle: 50deg;">
          <span class="ray-label">review</span>
        </a>
        <div class="deco-ray" style="--angle: 60deg;"></div>
        <div class="deco-ray" style="--angle: 70deg;"></div>
        <div class="deco-ray" style="--angle: 80deg;"></div>
        <div class="deco-ray" style="--angle: 90deg;"></div>
      </div>
    </div>
  </body>
</html>
